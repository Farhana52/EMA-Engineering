<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Vibrant App Tile Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Document Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Power Spark Gradient -->
    <linearGradient id="sparkGrad" x1="75" y1="65" x2="95" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Premium Drop Shadows -->
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#020617" flood-opacity="0.32" />
    </filter>
    <filter id="sparkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#020617" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2" fill="none" />

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#sheetShadow)">
    <path d="M 28 22 C 28 17.58 31.58 14 36 14 H 72 L 100 42 V 106 C 100 110.42 96.42 114 92 114 H 36 C 31.58 114 28 110.42 28 106 Z" fill="url(#sheetGrad)" />
    <!-- 3D Fold -->
    <path d="M 72 14 V 36 C 72 39.314 74.686 42 78 42 H 100 Z" fill="#CBD5E1" />
  </g>

  <!-- Clean Invoice / Quotation Ledger Rows -->
  <rect x="39" y="27" width="25" height="7" rx="3.5" fill="#2563EB" />
  <rect x="39" y="44" width="48" height="5" rx="2.5" fill="#94A3B8" />
  <rect x="39" y="57" width="48" height="5" rx="2.5" fill="#CBD5E1" />
  <rect x="39" y="70" width="30" height="5" rx="2.5" fill="#E2E8F0" />

  <!-- Floating Power Spark Badge (EMA Engineering: The power you can trust!) -->
  <g filter="url(#sparkShadow)">
    <circle cx="85" cy="85" r="23" fill="#FFFFFF" />
    <circle cx="85" cy="85" r="20.5" fill="url(#bgGrad)" />
    <path d="M 87 67 L 74 86 H 84 L 81 103 L 97 83 H 87 L 91 67 Z" fill="url(#sparkGrad)" stroke="#B45309" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>